<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reportar un problema</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6B53}a:hover{color:#084C3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF1EF; font-family: 'DM Sans', sans-serif; color: #14201C; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 13px; color: #4E5C56">Casa 14, Jurica · desde el QR de la cocina</span>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">¿Qué está pasando?</h1>
  </header>

  <div role="group" aria-label="Tipo de problema" style="display: flex; flex-wrap: wrap; gap: 8px">
    <button type="button" aria-pressed="false" style="font: inherit; font-size: 13px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #C3CEC9; background: #FFFFFF; color: #14201C">Plomería</button>
    <button type="button" aria-pressed="true" style="font: inherit; font-size: 13px; font-weight: 700; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: #14201C; color: #FFFFFF">Humedad</button>
    <button type="button" aria-pressed="false" style="font: inherit; font-size: 13px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #C3CEC9; background: #FFFFFF; color: #14201C">Electricidad</button>
    <button type="button" aria-pressed="false" style="font: inherit; font-size: 13px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #C3CEC9; background: #FFFFFF; color: #14201C">Cerrajería</button>
    <button type="button" aria-pressed="false" style="font: inherit; font-size: 13px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #C3CEC9; background: #FFFFFF; color: #14201C">Otro</button>
  </div>

  <section aria-label="Fotos y video" style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Fotos y video</h2>
      <span style="font-size: 12px; color: #4E5C56">3 de 6</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="height: 92px; border-radius: 10px; background: #C9D6D0; position: relative; display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        <span style="position: absolute; bottom: 6px; right: 6px; background: #14201C; color: #FFFFFF; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px">0:12</span>
      </div>
      <div style="height: 92px; border-radius: 10px; background: #D8E3DE; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4E5C56">[Foto]</div>
      <div style="height: 92px; border-radius: 10px; background: #D8E3DE; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4E5C56">[Foto]</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="font: inherit; font-size: 14px; font-weight: 700; min-height: 48px; border-radius: 12px; border: 1px dashed #0B6B53; background: #F2FAF7; color: #0B5A46; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v12H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        Tomar foto
      </button>
      <button type="button" style="font: inherit; font-size: 14px; font-weight: 700; min-height: 48px; border-radius: 12px; border: 1px dashed #0B6B53; background: #F2FAF7; color: #0B5A46; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3z"></path></svg>
        Grabar video
      </button>
    </div>
    <div style="background: #FFF4E5; color: #6B3A06; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.4">Tip: graba 10 segundos mostrando la mancha completa y de dónde parece venir el agua.</div>
  </section>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">
    Cuéntanos en una frase
    <textarea rows="2" style="font: inherit; font-size: 14px; font-weight: 400; border: 1px solid #C3CEC9; border-radius: 12px; padding: 10px 12px; resize: none; background: #FFFFFF; color: #14201C">Mancha de humedad que crece en la pared de la recámara del fondo</textarea>
  </label>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 700">¿Cuándo pueden entrar a revisar?</span>
    <div role="group" aria-label="Disponibilidad" style="display: flex; gap: 8px; flex-wrap: wrap">
      <button type="button" aria-pressed="true" style="font: inherit; font-size: 13px; font-weight: 700; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 2px solid #0B6B53; background: #E3F4EE; color: #0B5A46">Mañanas</button>
      <button type="button" aria-pressed="false" style="font: inherit; font-size: 13px; font-weight: 600; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #C3CEC9; background: #FFFFFF; color: #14201C">Tardes</button>
      <button type="button" aria-pressed="true" style="font: inherit; font-size: 13px; font-weight: 700; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 2px solid #0B6B53; background: #E3F4EE; color: #0B5A46">Sábado</button>
    </div>
  </div>

  <a href="Proveedor.dc.html" style="margin-top: auto; text-decoration: none; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #0B6B53; color: #FFFFFF; font-weight: 700; font-size: 15px">Enviar reporte</a>
  <span style="font-size: 12px; color: #4E5C56; text-align: center; margin-top: -8px">Lo ven tu administrador y los proveedores de humedad cercanos</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
